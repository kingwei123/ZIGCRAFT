name: 功能建议
description: 提出新功能或改进建议
title: "[建议] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 相关需求或问题
      description: 描述这个建议希望解决的需求或问题。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 描述你希望如何实现或使用该功能。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 描述你考虑过的替代方案（可选）。
    validations:
      required: false
